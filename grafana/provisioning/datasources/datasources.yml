apiVersion: 1

datasources:
  # VictoriaMetrics speaks PromQL (MetricsQL is a superset), so the stock Prometheus datasource type works
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
