global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  # Only has data when started with --profile load
  - job_name: avalanche
    static_configs:
      - targets: ["avalanche:9001"]
